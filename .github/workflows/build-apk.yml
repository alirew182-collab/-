name: Build APK

on:
  push:
    branches: [ "claude/**", "main", "master" ]
    paths-ignore: [ "dist/**", "**.md", "roblox-blacksmith/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.NEURON_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Сертификаты Минцифры для GigaChat (необязательно)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/certs
          curl -fsSL --max-time 30 -o app/src/main/assets/certs/russian_trusted_root_ca.crt https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt || rm -f app/src/main/assets/certs/russian_trusted_root_ca.crt
          curl -fsSL --max-time 30 -o app/src/main/assets/certs/russian_trusted_sub_ca.crt https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt || rm -f app/src/main/assets/certs/russian_trusted_sub_ca.crt
          ls -la app/src/main/assets/certs
      - name: Build release APK
        env:
          NEURON_KEYSTORE_PASSWORD: ${{ secrets.NEURON_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuronAcademy-apk
          path: app/build/outputs/apk/release/*.apk
      # APK публикуется только с постоянной подписью: иначе он не встанет поверх установленной версии
      - name: Commit APK to branch
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NeuronAcademy.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/NeuronAcademy.apk
          git commit -m "Собранный APK [skip ci]" || exit 0
          git push
      # Без секрета APK кладётся в dist/pending/: его переподписывают постоянным ключом вручную,
      # а в dist/NeuronAcademy.apk попадает только сборка с постоянной подписью.
      - name: Нет секрета с паролем ключа
        if: env.HAS_RELEASE_KEY != 'true'
        run: |
          echo "::warning::Секрет NEURON_KEYSTORE_PASSWORD не задан. APK подписан временным ключом и положен в dist/pending/ для переподписи."
          mkdir -p dist/pending
          cp app/build/outputs/apk/release/app-release.apk dist/pending/NeuronAcademy-tempkey.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/pending/NeuronAcademy-tempkey.apk
          git commit -m "APK с временной подписью для переподписи [skip ci]" || exit 0
          git push
