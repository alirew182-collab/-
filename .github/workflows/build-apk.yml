name: Build APK

on:
  push:
    branches: [ "claude/**", "main", "master" ]
    paths-ignore: [ "dist/**", "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuronAcademy-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Commit APK to branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NeuronAcademy.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/NeuronAcademy.apk
          git commit -m "Собранный APK [skip ci]" || exit 0
          git push
